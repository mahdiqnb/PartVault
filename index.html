<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self' file:; img-src 'self' file: data:; style-src 'self' file: 'unsafe-inline'; script-src 'unsafe-inline'; font-src 'self' file: data:">
<title>PartVault</title>
<style>
@font-face{font-family:'Vazirmatn';src:url('fonts/Vazirmatn-VF.woff2') format('woff2');font-weight:100 900;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono-400.woff2') format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono-500.woff2') format('woff2');font-weight:500;font-display:swap}
@font-face{font-family:'JetBrains Mono';src:url('fonts/JetBrainsMono-700.woff2') format('woff2');font-weight:700;font-display:swap}
[hidden]{display:none!important}body{margin:0}img{max-width:100%}
</style>
<style>
/* Layout: slim sticky bar (emblem, search, add), a hero that carries the owner's logo over animated circuit traces with the summary figures, then three tabs (parts / boxes / data). Single committed dark world: steel-black with gold, taken from the logo. */
:root{
  --bg:#07090b;
  --surface:#0d1115;
  --raised:#141b21;
  --line:#202a32;
  --line-strong:#34434f;
  --fg:#eef2f5;
  --muted:#93a1ad;
  --faint:#5f6e7a;
  --gold:#e8a63c;
  --gold-hi:#ffd88a;
  --gold-lo:#b06d17;
  --gold-grad:linear-gradient(180deg,#ffe3a6 0%,#e8a63c 48%,#b06d17 100%);
  --accent:#e8a63c;
  --accent-ink:#1c1103;
  --accent-soft:rgba(232,166,60,.13);
  --ok:#3ddc97;
  --warn:#ff8a4c;
  --bad:#ff4d6d;
  --font-ui:'Vazirmatn',system-ui,'Segoe UI',Tahoma,sans-serif;
  --font-code:'JetBrains Mono',ui-monospace,'SF Mono',Consolas,monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  font-family:var(--font-ui);font-size:15px;line-height:1.6;color:var(--fg);
  background-color:var(--bg);
  background-image:radial-gradient(1000px 460px at 85% -10%,rgba(232,166,60,.11),transparent 60%),radial-gradient(circle at 1px 1px,rgba(147,161,173,.09) 1px,transparent 0);
  background-size:auto,24px 24px;
}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
svg{width:1.15em;height:1.15em;flex:none;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.mono{font-family:var(--font-code);font-variant-numeric:tabular-nums}

.app{max-width:80rem;margin-inline:auto;padding-inline:clamp(16px,3vw,36px);padding-block:0 3rem}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:.9rem 1.25rem;align-items:center;padding-block:.75rem;background:rgba(7,9,11,.84);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.top::after{content:"";position:absolute;inset-inline:0;bottom:0;height:1px;background:linear-gradient(90deg,transparent,var(--line-strong) 10%,var(--gold) 50%,var(--line-strong) 90%,transparent);opacity:.8}
.brand{display:flex;align-items:center;gap:.7rem;min-width:0}
.markimg{height:2.7rem;width:auto;filter:drop-shadow(0 0 10px rgba(232,166,60,.35))}
.brand b{display:block;font-family:var(--font-code);font-size:1.12rem;letter-spacing:.08em;font-weight:700;line-height:1.2}
.brand small{display:block;color:var(--muted);font-size:.78rem;line-height:1.2}
.search{position:relative;min-width:0}
.search svg{position:absolute;inset-inline-start:.85rem;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.search input{width:100%;height:2.7rem;padding-inline:2.5rem 3rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:10px;outline-offset:0}
.search input::placeholder{color:var(--faint)}
.search input:focus{border-color:var(--gold);box-shadow:0 0 0 3px var(--accent-soft)}
.kbd{position:absolute;inset-inline-end:.7rem;top:50%;translate:0 -50%;font-family:var(--font-code);font-size:.72rem;color:var(--muted);border:1px solid var(--line-strong);border-radius:5px;padding:.05rem .4rem;pointer-events:none}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:.45rem;height:2.7rem;padding-inline:1.05rem;border-radius:10px;border:1px solid #f2bb57;background:linear-gradient(180deg,#f7c565,#d48d28);color:var(--accent-ink);font-weight:700;white-space:nowrap;box-shadow:inset 0 1px 0 rgba(255,255,255,.35),0 8px 24px -8px rgba(232,166,60,.6)}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line-strong);box-shadow:none;font-weight:500}
.btn.ghost:hover{border-color:var(--gold);color:var(--gold-hi);filter:none}
.btn.sm{height:2.2rem;padding-inline:.8rem;font-size:.9rem}
.btn.danger{background:transparent;border-color:rgba(255,77,109,.5);color:var(--bad);box-shadow:none}
.btn:disabled{opacity:.45;cursor:not-allowed;filter:none}
.ib{display:inline-grid;place-items:center;width:2.2rem;height:2.2rem;border-radius:8px;border:1px solid transparent;background:transparent;color:var(--muted)}
.ib:hover{background:var(--raised);color:var(--fg);border-color:var(--line)}
.ib.bad:hover{color:var(--bad)}

/* hero */
.hero{position:relative;isolation:isolate;display:grid;grid-template-columns:minmax(0,21rem) minmax(0,1fr);gap:1.2rem 2.6rem;align-items:center;margin-top:1.1rem;padding:1.4rem clamp(1rem,3vw,2.2rem);border:1px solid var(--line-strong);border-radius:18px;background:radial-gradient(55% 130% at 18% 50%,rgba(232,166,60,.16),transparent 70%),linear-gradient(180deg,var(--surface),var(--bg));overflow:hidden}
.hero::before{content:"";position:absolute;inset-inline:8%;top:0;height:1px;background:linear-gradient(90deg,transparent,var(--gold-hi),transparent);opacity:.85}
.traces{position:absolute;inset:0;width:100%;height:100%;z-index:-1;color:var(--gold);stroke-width:1;pointer-events:none}
.traces .base{fill:none;stroke:currentColor;stroke-width:1.3;opacity:.32}
.traces circle{fill:var(--bg);stroke:currentColor;stroke-width:1.6;opacity:.65}
.traces .pulse{fill:none;stroke:var(--gold-hi);stroke-width:2.6;stroke-linecap:round;stroke-dasharray:5 95;stroke-dashoffset:0;filter:drop-shadow(0 0 5px #ffd88a);animation:flow 7s linear infinite}
.traces .pulse:nth-of-type(2){animation-delay:-2s;animation-duration:8s}
.traces .pulse:nth-of-type(3){animation-delay:-4s;animation-duration:6.5s}
.traces .pulse:nth-of-type(4){animation-delay:-1s;animation-duration:9s}
@keyframes flow{to{stroke-dashoffset:-100}}
.logo{width:100%;max-width:21rem;height:auto;justify-self:center;filter:drop-shadow(0 0 30px rgba(232,166,60,.3))}
.hero-main{display:flex;flex-direction:column;gap:.9rem;min-width:0}
.eyebrow{font-family:var(--font-code);font-size:.76rem;letter-spacing:.28em;text-transform:uppercase;color:var(--gold)}
.hero h1{margin:0;font-size:clamp(2rem,4.6vw,3.2rem);font-weight:800;line-height:1.15;text-wrap:balance;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{margin:0;color:var(--muted);max-width:34rem}

.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.6rem;margin-top:.4rem}
.stat{display:flex;flex-direction:column;gap:.1rem;min-width:0;padding:.7rem .9rem;text-align:start;background:linear-gradient(180deg,rgba(255,255,255,.035),rgba(255,255,255,.01));border:1px solid var(--line-strong);border-radius:12px}
.stat span{color:var(--muted);font-size:.78rem}
.stat b{font-family:var(--font-code);font-size:1.75rem;font-weight:700;line-height:1.25;font-variant-numeric:tabular-nums;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent}
button.stat{cursor:pointer}
button.stat:hover{border-color:var(--gold)}
.stat.alert b{background:none;color:var(--warn)}
.stat.on{border-color:var(--gold);background:var(--accent-soft)}

/* tabs */
.tabs{display:flex;gap:.3rem;margin-top:1.4rem;padding:.25rem;width:max-content;max-width:100%;overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:11px}
.tab{display:inline-flex;align-items:center;gap:.5rem;height:2.3rem;padding-inline:1rem;border-radius:8px;border:0;background:transparent;color:var(--muted);white-space:nowrap}
.tab:hover{color:var(--fg)}
.tab[aria-selected="true"]{background:var(--raised);color:var(--fg);box-shadow:inset 0 0 0 1px var(--line-strong),inset 0 -2px 0 var(--gold)}
.tab em{font-style:normal;font-family:var(--font-code);font-size:.78rem;color:var(--gold)}

.view{margin-top:1.1rem}

/* filters */
.bar{display:flex;flex-direction:column;gap:.7rem;margin-bottom:.9rem}
.chips{display:flex;gap:.45rem;overflow-x:auto;padding-bottom:.2rem;scrollbar-width:thin}
.chip{flex:none;display:inline-flex;align-items:center;gap:.4rem;height:2.1rem;padding-inline:.85rem;border-radius:999px;border:1px solid var(--line-strong);background:transparent;color:var(--muted);font-size:.88rem;white-space:nowrap}
.chip:hover{color:var(--fg);border-color:var(--faint)}
.chip[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--gold);color:var(--gold-hi)}
.chip i{font-style:normal;font-family:var(--font-code);font-size:.74rem;opacity:.8}
.ctrls{display:flex;flex-wrap:wrap;gap:.6rem;align-items:center}
.ctrls .fill{flex:1}
.sel{display:flex;align-items:center;gap:.5rem;color:var(--muted);font-size:.85rem}
select,.in{height:2.4rem;padding-inline:.7rem;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px;color:var(--fg);min-width:0}
select:focus,.in:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.count{color:var(--muted);font-size:.85rem}

/* parts table */
.table{border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);overflow:hidden}
.thead,.row{display:grid;grid-template-columns:6.8rem minmax(0,1fr) 6.5rem 11.4rem 5.4rem;gap:.9rem;align-items:center;padding:.65rem 1rem}
.thead{color:var(--faint);font-size:.76rem;letter-spacing:.04em;background:var(--bg);border-bottom:1px solid var(--line-strong)}
.th{display:inline-flex;align-items:center;gap:.35rem;padding:0;border:0;background:none;color:inherit;font:inherit;letter-spacing:inherit;text-align:start;cursor:pointer}
.th:hover{color:var(--fg)}
.th.on{color:var(--gold-hi)}
.th .arr{font-size:.62rem}
.grp{display:flex;align-items:center;justify-content:space-between;gap:.8rem;padding:.45rem 1rem;background:linear-gradient(90deg,rgba(232,166,60,.1),transparent 70%);border-bottom:1px solid var(--line-strong);color:var(--gold-hi);font-size:.82rem;font-weight:600}
.grp i{font-style:normal;font-family:var(--font-code);font-size:.74rem;color:var(--muted)}
.dup{display:flex;flex-direction:column;align-items:flex-start;gap:.5rem;margin-bottom:1rem;padding:.8rem 1rem;border:1px solid var(--bad);border-radius:10px;background:rgba(255,77,109,.1);color:#ffd9de;font-size:.9rem}
.dup b{color:var(--bad)}
.catlist{display:flex;flex-wrap:wrap;gap:.4rem}
.catlist .pill{gap:.35rem;color:var(--fg)}
.catlist .ib{width:1.6rem;height:1.6rem}
.row{border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row:hover{background:linear-gradient(270deg,rgba(232,166,60,.07),transparent 70%)}
.c-main{min-width:0}
.nm{font-weight:600;overflow-wrap:anywhere}
.sub{display:flex;flex-wrap:wrap;gap:.1rem .7rem;color:var(--muted);font-size:.82rem}
.sub span{overflow-wrap:anywhere}
.code{display:inline-block;max-width:100%;font-family:var(--font-code);font-weight:700;font-size:.86rem;letter-spacing:.05em;padding:.2rem .6rem;border:1px dashed rgba(232,166,60,.6);border-radius:6px;color:var(--gold-hi);background:var(--accent-soft);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
button.code:hover{background:rgba(232,166,60,.26)}
.code.none{font-family:var(--font-ui);font-weight:400;letter-spacing:0;color:var(--faint);border-color:var(--line-strong);background:transparent;font-size:.8rem}
.pkg{font-family:var(--font-code);font-size:.82rem;color:var(--fg);padding:.12rem .5rem;border-radius:5px;background:var(--bg);border:1px solid var(--line-strong)}
.c-qty{display:flex;align-items:center;gap:.7rem}
.led{flex:none;width:.62rem;height:.62rem;border-radius:50%;background:var(--ok);box-shadow:0 0 .65rem var(--ok)}
.led.warn{background:var(--warn);box-shadow:0 0 .7rem var(--warn);animation:pulse 2.4s ease-in-out infinite}
.led.bad{background:var(--bad);box-shadow:0 0 .7rem var(--bad);animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.4}}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line-strong);border-radius:8px;background:var(--bg);overflow:hidden}
.qb{display:grid;place-items:center;width:2rem;height:2.1rem;border:0;background:transparent;color:var(--muted)}
.qb:hover{background:var(--accent-soft);color:var(--gold-hi)}
.qn{width:3.6rem;height:2.1rem;border:0;background:transparent;text-align:center;font-family:var(--font-code);font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;padding:0}
.qn::-webkit-outer-spin-button,.qn::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.qn:focus{outline:none;background:var(--raised)}
.lvl{height:2.1rem;min-width:7.4rem;padding-inline:.6rem;border-radius:8px;background:var(--bg);font-size:.88rem}
.c-act{display:flex;justify-content:flex-end;gap:.1rem;align-items:center}
.ask{display:flex;gap:.3rem;align-items:center;font-size:.8rem;color:var(--bad)}
.ask button{height:1.9rem;padding-inline:.6rem;border-radius:6px;border:1px solid var(--line-strong);background:transparent;font-size:.8rem}
.ask button.yes{background:var(--bad);border-color:var(--bad);color:#1a0507;font-weight:600}

.notice{display:flex;flex-wrap:wrap;align-items:center;gap:.6rem 1rem;justify-content:space-between;padding:.7rem 1rem;margin-bottom:.9rem;border:1px dashed var(--line-strong);border-radius:10px;color:var(--muted);font-size:.88rem}

/* boxes */
.boxes{display:grid;grid-template-columns:repeat(auto-fill,minmax(15.5rem,1fr));gap:.9rem}
.bx{display:flex;flex-direction:column;gap:.55rem;min-width:0;padding:1.15rem 1.3rem;border:1px solid var(--line-strong);border-radius:14px;background-color:var(--surface);
  background-image:radial-gradient(circle,#46566a 0 1.7px,transparent 2.3px),radial-gradient(circle,#46566a 0 1.7px,transparent 2.3px),radial-gradient(circle,#46566a 0 1.7px,transparent 2.3px),radial-gradient(circle,#46566a 0 1.7px,transparent 2.3px);
  background-repeat:no-repeat;background-size:7px 7px;
  background-position:8px 8px,calc(100% - 8px) 8px,8px calc(100% - 8px),calc(100% - 8px) calc(100% - 8px)}
.bx:hover{border-color:rgba(232,166,60,.55);background-color:var(--raised)}
.bx .big{font-family:var(--font-code);font-weight:700;font-size:2.1rem;letter-spacing:.07em;line-height:1.1;overflow-wrap:anywhere;background:var(--gold-grad);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 14px rgba(232,166,60,.25))}
.bx h3{margin:0;font-size:1rem;font-weight:600;overflow-wrap:anywhere}
.bx p{margin:0;color:var(--muted);font-size:.85rem;overflow-wrap:anywhere}
.bx .meta{display:flex;align-items:center;gap:.6rem;color:var(--muted);font-size:.84rem}
.bx .foot{display:flex;justify-content:space-between;align-items:center;gap:.5rem;margin-top:auto;padding-top:.5rem;border-top:1px dashed var(--line-strong)}
.bx.add{align-items:center;justify-content:center;border-style:dashed;background-image:none;background-color:transparent;color:var(--muted);min-height:11rem;cursor:pointer;font-size:.95rem}
.bx.add:hover{color:var(--gold-hi);border-color:var(--gold);background-color:transparent}
.bx.add svg{width:1.6rem;height:1.6rem}

/* data view */
.panels{display:grid;grid-template-columns:repeat(auto-fit,minmax(18rem,1fr));gap:.9rem}
.panel{display:flex;flex-direction:column;gap:.7rem;min-width:0;padding:1.1rem;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface)}
.panel h3{margin:0;font-size:1rem}
.panel p{margin:0;color:var(--muted);font-size:.88rem}
.panel .acts{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:auto}
.pill{display:inline-flex;align-items:center;gap:.45rem;padding:.15rem .7rem;border-radius:999px;border:1px solid var(--line-strong);font-size:.78rem;color:var(--muted);white-space:nowrap}
.pill .led{width:.5rem;height:.5rem}
input[type=file]{display:none}

/* empty */
.empty{display:flex;flex-direction:column;align-items:flex-start;gap:.8rem;padding:2.2rem clamp(1rem,4vw,2.5rem);border:1px dashed var(--line-strong);border-radius:14px;background:var(--surface)}
.empty h2{margin:0;font-size:1.35rem;text-wrap:balance}
.empty p{margin:0;color:var(--muted);max-width:42rem}
.empty .acts{display:flex;flex-wrap:wrap;gap:.6rem;margin-top:.3rem}
.empty .glyph{color:var(--gold)}
.empty .glyph svg{width:2.6rem;height:2.6rem;stroke-width:1.4}

/* drawer */
.dr{position:fixed;inset:0;z-index:50;display:flex;justify-content:flex-end}
.dr-bg{position:absolute;inset:0;background:rgba(2,4,5,.74);backdrop-filter:blur(3px)}
.dr-panel{position:relative;width:min(30rem,100%);height:100%;display:flex;flex-direction:column;background:var(--surface);border-inline-start:1px solid var(--line-strong);box-shadow:0 0 60px rgba(0,0,0,.65);animation:in .18s ease-out}
@keyframes in{from{transform:translateX(-24px);opacity:0}to{transform:none;opacity:1}}
.dr-head{display:flex;align-items:center;justify-content:space-between;padding:1rem 1.2rem;border-bottom:1px solid var(--line-strong)}
.dr-head h2{margin:0;font-size:1.1rem}
.dr-body{flex:1;overflow-y:auto;padding:1.2rem;padding-bottom:calc(1.2rem + env(safe-area-inset-bottom,0px))}
.fg{display:grid;grid-template-columns:repeat(auto-fit,minmax(11rem,1fr));gap:.9rem}
.fld{display:flex;flex-direction:column;gap:.3rem;min-width:0}
.fld.full{grid-column:1/-1}
.fld label{font-size:.82rem;color:var(--muted)}
.fld .in,.fld select,.fld textarea{width:100%}
.fld textarea{min-height:4.5rem;padding:.55rem .7rem;resize:vertical;background:var(--surface);border:1px solid var(--line-strong);border-radius:8px}
.fld textarea:focus{border-color:var(--gold);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.fld .hint{font-size:.76rem;color:var(--faint)}
.fld .in[readonly]{color:var(--gold-hi);background:var(--bg);font-family:var(--font-code);font-weight:700}
.ltr{direction:ltr;text-align:left;font-family:var(--font-code)}
.form-act{display:flex;gap:.6rem;margin-top:1.3rem}

.toast{position:fixed;inset-inline:0;bottom:calc(1rem + env(safe-area-inset-bottom,0px));display:flex;justify-content:center;z-index:80;pointer-events:none}
.toast div{pointer-events:auto;max-width:min(32rem,calc(100% - 32px));padding:.65rem 1rem;border-radius:10px;background:var(--raised);border:1px solid var(--line-strong);box-shadow:0 10px 40px rgba(0,0,0,.6);font-size:.92rem}
.toast div.bad{border-color:var(--bad);color:#ffd9de}
.toast div.ok{border-color:var(--gold)}

@media (max-width:900px){
  .hero{grid-template-columns:minmax(0,1fr);justify-items:start}
  .logo{max-width:15rem;justify-self:start}
}
@media (max-width:760px){
  .top{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"brand add" "search search"}
  .brand{grid-area:brand}.search{grid-area:search}.top .btn{grid-area:add}
  .btn .lbl{display:none}
  .top .btn{width:2.7rem;padding:0}
  .stats{grid-template-columns:repeat(2,minmax(0,1fr))}
  .thead{display:none}
  .row{grid-template-columns:auto minmax(0,1fr) auto;grid-template-areas:"box main act" "pkg qty qty";gap:.55rem .8rem;align-items:start;padding:.8rem 1rem}
  .c-box{grid-area:box}.c-main{grid-area:main}.c-act{grid-area:act}.c-pkg{grid-area:pkg}.c-qty{grid-area:qty;justify-content:flex-end}
  .ask{flex-wrap:wrap;justify-content:flex-end}
}
@media (prefers-reduced-motion:reduce){
  .dr-panel{animation:none}
  .traces .pulse{animation:none;opacity:0}
  .led.warn,.led.bad{animation:none}
}
</style>

</head>
<body>
<div class="app" dir="rtl" lang="fa">

function buildCatIdx(){CI={};allCats().forEach(function(c,i){CI[c.k]=i})}
function catIdx(k){return CI[k]==null?999:CI[k]}
function catOf(k){var a=allCats();for(var i=0;i<a.length;i++)if(a[i].k===k)return a[i];return CATS[CATS.length-1]}
function derivePrefix(name){var m=/[A-Za-z]/.exec(String(name));return m?m[0].toUpperCase():'Z'}
var SI={p:1e-12,n:1e-9,u:1e-6,'µ':1e-6,m:1e-3,k:1e3,K:1e3,M:1e6,G:1e9,R:1,r:1};
function valueOf(name){
  var s=toLatin(name).replace(/،/g,'.');
  var m=/^\s*(\d+)([pnuµmkKMGRr])(\d+)/.exec(s);
  if(m)return parseFloat(m[1]+'.'+m[3])*(SI[m[2]]||1);
  m=/^\s*(\d+(?:[.,]\d+)?)\s*([pnuµmkKMG]?)/.exec(s);
  if(!m)return Infinity;
  return parseFloat(m[1].replace(',','.'))*(SI[m[2]]||1);
}
function valCmp(a,b){var x=valueOf(a.name),y=valueOf(b.name);return x===y?0:(x<y?-1:1)}
function sorter(a,b){
  var ci=catIdx(a.cat)-catIdx(b.cat),pk=cmp(a.pkg||'~',b.pkg||'~'),nm=cmp(a.name,b.name);
  switch(S.sort){
    case 'cat':return ci||pk||valCmp(a,b)||nm;
    case 'pkg':return pk||ci||valCmp(a,b)||nm;
    case 'value':return ci||valCmp(a,b)||pk||nm;
    case 'name':return nm;
    case 'qty':return rank(a)-rank(b)||nm;
    case 'new':return (b.updatedAt||0)-(a.updatedAt||0)||nm;
    default:return cmp(a.box||'~',b.box||'~')||ci||pk||valCmp(a,b)||nm;
  }
}
function cmp(a,b){return String(a).localeCompare(String(b),'en',{numeric:true})}
function safeUrl(u){u=String(u||'').trim();return /^https?:\/\//i.test(u)?u:''}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function fmt(n){return String(n).replace(/\B(?=(\d{3})+(?!\d))/g,',')}
function boxById(c){for(var i=0;i<S.boxes.length;i++)if(S.boxes[i].id===c)return S.boxes[i];return null}
function isLvl(p){return p.qmode==='level'}
function qtyOf(p){var d=pend[p.id];return d&&d.v!=null?d.v:(+p.qty||0)}
function levelOf(p){var d=pend[p.id];return (d&&d.level)||p.level||'plenty'}
function status(p){
  if(isLvl(p)){var l=levelOf(p);return l==='out'?'bad':l==='low'?'warn':'ok'}
  var q=qtyOf(p),m=+p.min||0;return q<=0?'bad':(m>0&&q<=m)?'warn':'ok';
}
function rank(p){if(isLvl(p))return {out:0,low:1,mid:1e6,plenty:1e6+1}[levelOf(p)];return qtyOf(p)}
var STT={ok:'موجودی کافی',warn:'رو به اتمام',bad:'تمام شده'};
function errMsg(e){
  var c=e&&e.code;
  if(c==='quota_exceeded')return 'فضای ذخیره‌سازی پر است. چند مورد را حذف کنید.';
  if(c==='invalid_argument')return 'اجازه‌ی تغییر داده‌ها را ندارید.';
  if(c==='resource_exhausted')return 'تعداد درخواست‌ها زیاد است. چند ثانیه صبر کنید.';
  if(c==='revoked')return 'دسترسی به این صفحه تغییر کرده است. صفحه را دوباره باز کنید.';
  return 'ذخیره نشد. دوباره تلاش کنید.';
}
var tT=0;
function toast(msg,kind){
  var t=$('toast');t.innerHTML='<div class="'+(kind||'ok')+'">'+esc(msg)+'</div>';
  clearTimeout(tT);tT=setTimeout(function(){t.innerHTML=''},kind==='bad'?5200:2600);
}
function nextCode(prefix){
  var mx=0,re=new RegExp('^'+prefix+'-(\\d+)$');
  S.boxes.forEach(function(b){var m=re.exec(b.id);if(m)mx=Math.max(mx,parseInt(m[1],10))});
  var n=mx+1;return prefix+'-'+(n<10?'0'+n:n);
}
function pool(items,fn,n){
  var i=0;n=n||4;
  var w=[];for(var k=0;k<n;k++)w.push((async function(){while(i<items.length){var it=items[i++];await fn(it)}})());
  return Promise.all(w);
}

/* ---------- storage ---------- */
function lsLoad(){try{var j=JSON.parse(localStorage.getItem(LS)||'null');if(j){S.parts=j.parts||[];S.boxes=j.boxes||[];S.cats=j.cats||[]}}catch(e){}}
function lsSave(){try{localStorage.setItem(LS,JSON.stringify({parts:S.parts,boxes:S.boxes,cats:S.cats}))}catch(e){}}
function arr(c){return c==='parts'?S.parts:c==='boxes'?S.boxes:S.cats}
var api={
  set:async function(c,id,data){
    if(cloud){await cloud.collection(c).doc(id).set(data);return}
    var a=arr(c),i=a.findIndex(function(x){return x.id===id}),o=Object.assign({id:id},data);
    if(i<0)a.push(o);else a[i]=o;lsSave();renderAll();
  },
  patch:async function(c,id,data){
    if(cloud){await cloud.collection(c).doc(id).update(data);return}
    var o=arr(c).find(function(x){return x.id===id});if(o)Object.assign(o,data);lsSave();
  },
  del:async function(c,id){
    if(cloud){await cloud.collection(c).doc(id).delete();return}
    var a=arr(c),i=a.findIndex(function(x){return x.id===id});if(i>=0)a.splice(i,1);lsSave();renderAll();
  }
};
async function boot(){
  var db=null;
  try{db=(window.claude&&window.claude.use)?await window.claude.use('db'):null}catch(e){db=null}
  try{dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null}catch(e){dl=null}
  if(db){
    cloud=db;S.mode='cloud';
    var onErr=function(e){toast(e&&e.code==='revoked'?errMsg(e):'اتصال به ذخیره‌سازی برقرار نشد.','bad')};
    db.collection('parts').onSnapshot(function(s){S.parts=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.ready.parts=true;renderAll()},onErr);
    db.collection('boxes').onSnapshot(function(s){S.boxes=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.ready.boxes=true;renderAll()},onErr);
    db.collection('cats').onSnapshot(function(s){S.cats=s.docs.map(function(d){return Object.assign({id:d.id},d.data())});S.ready.cats=true;renderAll()},onErr);
  }else{
    S.mode='local';lsLoad();S.ready.parts=S.ready.boxes=S.ready.cats=true;
  }
  renderAll();
}

/* ---------- derived ---------- */
function hay(p){var b=boxById(p.box);return norm([p.name,catOf(p.cat).n,p.pkg,p.box,b?b.title:'',b?b.loc:'',p.mpn,p.note,isLvl(p)?LVL[levelOf(p)]:''].join(' '))}
function filtered(){
  var list=S.parts.filter(function(p){
    if(S.cat&&p.cat!==S.cat)return false;
    if(S.pkg&&(p.pkg||'')!==S.pkg)return false;
    if(S.box){if(S.box==='__none'){if(p.box)return false}else if(p.box!==S.box)return false}
    if(S.low&&status(p)==='ok')return false;
    if(S.tokens.length){var h=hay(p);for(var i=0;i<S.tokens.length;i++)if(h.indexOf(S.tokens[i])<0)return false}
    return true;
  });
  buildCatIdx();
  list.sort(sorter);
  if(S.dir==='desc')list.reverse();
  return list;
}

   '<div class="stat"><span>انواع قطعه</span><b>'+fmt(S.parts.length)+'</b></div>'+

   '<button class="stat '+(low?'alert':'')+(S.low?' on':'')+'" data-act="low-stat" title="نمایش قطعات کم‌موجودی"><span>کم‌موجودی / تمام‌شده</span><b>'+fmt(low)+'</b></button>';
}

function groupOf(p){
  if(S.sort==='box'){var b=boxById(p.box);return p.box?p.box+(b&&b.title?' · '+b.title:''):'بدون باکس'}
  if(S.sort==='cat')return catOf(p.cat).n;
  if(S.sort==='pkg')return p.pkg||'بدون پکیج';
  return null;
}
function rowsHTML(list){
  if(groupOf(list[0])===null)return list.map(rowHTML).join('');
  var cnt={};list.forEach(function(p){var g=groupOf(p);cnt[g]=(cnt[g]||0)+1});
  var last=null,h='';
  list.forEach(function(p){var g=groupOf(p);if(g!==last){h+='<div class="grp"><span>'+esc(g)+'</span><i>'+cnt[g]+'</i></div>';last=g}h+=rowHTML(p)});
  return h;
}

/* ---------- CSV ---------- */
function toCSV(rows){
  return '﻿'+rows.map(function(r){return r.map(function(c){c=String(c==null?'':c);return /[",\n\r;]/.test(c)?'"'+c.replace(/"/g,'""')+'"':c}).join(',')}).join('\r\n');
}
function parseCSV(text){
  text=text.replace(/^﻿/,'');
  var first=text.split(/\r?\n/)[0]||'';
  var d=(first.split(';').length>first.split(',').length)?';':',';
  var rows=[],row=[],cur='',q=false;
  for(var i=0;i<text.length;i++){
    var c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){cur+='"';i++}else q=false}else cur+=c}
    else if(c==='"')q=true;
    else if(c===d){row.push(cur);cur=''}
    else if(c==='\n'||c==='\r'){if(c==='\r'&&text[i+1]==='\n')i++;row.push(cur);cur='';rows.push(row);row=[]}
    else cur+=c;
  }
  if(cur!==''||row.length){row.push(cur);rows.push(row)}
  return rows.filter(function(r){return r.some(function(x){return String(x).trim()!==''})});
}
var HRAW={name:'name',نام:'name','نام/مقدار':'name','نام / مقدار':'name',قطعه:'name',مقدار:'name',category:'cat',دسته:'cat','دسته‌بندی':'cat',نوع:'cat',package:'pkg',پکیج:'pkg',qty:'qty',تعداد:'qty',min:'min',حداقل:'min','حداقل موجودی':'min',box:'box',باکس:'box','کد باکس':'box',mpn:'mpn','پارت‌نامبر':'mpn','پارت نامبر':'mpn',datasheet:'link',لینک:'link','لینک دیتاشیت':'link',دیتاشیت:'link',note:'note',توضیحات:'note',status:'level',level:'level',وضعیت:'level','وضعیت موجودی':'level',موجودی:'qty'};
var HMAP={};Object.keys(HRAW).forEach(function(k){HMAP[norm(k)]=HRAW[k]});
function catFromText(t){
  var x=norm(t);if(!x)return 'oth';
  var A=allCats();
  for(var i=0;i<A.length;i++){var c=A[i];if(c.k===x||norm(c.n)===x||c.p.toLowerCase()===x)return c.k}
  for(var j=0;j<A.length;j++){var n=norm(A[j].n);if(n.indexOf(x)===0||x.indexOf(norm(A[j].n.split(' ')[0]))===0)return A[j].k}
  return null;
}
function levelFromText(t){
  var x=norm(t);if(!x)return '';
  if(/فراوان|زیاد|کافی|plenty|bulk|many|enough/.test(x))return 'plenty';
  if(/متوسط|mid|medium/.test(x))return 'mid';
  if(/رو به اتمام|^کم|low/.test(x))return 'low';
  if(/تمام|اتمام|ندارم|out|none/.test(x))return 'out';
  return '';
}

    '<button type="button" class="btn ghost sm" data-act="dup-edit" data-id="'+esc(same[0].id)+'">باز کردن قطعه‌ی موجود</button>';
  el.hidden=false;if(el.scrollIntoView)el.scrollIntoView({block:'nearest'});

async function importCSV(text){
  var rows=parseCSV(text);
  if(rows.length<2){toast('فایل خالی است یا ردیف داده ندارد.','bad');return}
  var cols=rows[0].map(function(h){return HMAP[norm(h)]||null});
  if(cols.indexOf('name')<0){toast('ستون «نام» در فایل پیدا نشد. از «قالب نمونه» استفاده کن.','bad');return}
  var existing={};S.parts.forEach(function(p){existing[dupKey(p)]=p});
  var items=[],newBoxes={},newCats={},seen={},skipped=[];
  rows.slice(1).forEach(function(r){
    var o={};cols.forEach(function(k,i){if(k&&o[k]==null||k&&o[k]==='')o[k]=String(r[i]==null?'':r[i]).trim()});
    if(!o.name)return;
    var box=(o.box||'').toUpperCase().replace(/\s+/g,'');
    if(box&&!/^[A-Z0-9_.\-]{1,24}$/.test(box))box='';
    var lv=levelFromText(o.level)||(isNaN(parseInt(toLatin(o.qty),10))?levelFromText(o.qty):'');
    var ck=catFromText(o.cat);
    if(ck===null){var nk=norm(o.cat);if(!newCats[nk])newCats[nk]={id:'c_'+uid(),name:String(o.cat).trim(),prefix:derivePrefix(o.cat),createdAt:Date.now()};ck=newCats[nk].id}
    var p={name:o.name,cat:ck,pkg:o.pkg||'',qmode:lv?'level':'count',level:lv||'',qty:lv?0:Math.max(0,parseInt(toLatin(o.qty),10)||0),min:lv?0:Math.max(0,parseInt(toLatin(o.min),10)||0),box:box,mpn:o.mpn||'',link:o.link||'',note:o.note||''};
    var k=dupKey(p);if(seen[k]){skipped.push(p.name+' (تکراری در فایل)');return}seen[k]=1;
    var ex=existing[k];
    if(ex&&(ex.box||'')!==box){skipped.push(p.name+' (از قبل در '+boxLabel(ex.box)+')');return}
    if(box&&!boxById(box))newBoxes[box]=1;
    items.push({id:ex?ex.id:uid(),data:Object.assign({},ex||{},p,{createdAt:(ex&&ex.createdAt)||Date.now(),updatedAt:Date.now()}),upd:!!ex});
  });
  if(!items.length){toast(skipped.length?'همه‌ی قطعات تکراری بودند و وارد نشدند: '+skipped.slice(0,3).join('، ')+(skipped.length>3?' …':''):'ردیف معتبری پیدا نشد.','bad');return}
  toast('در حال وارد کردن '+items.length+' قطعه…');
  try{
    await pool(Object.keys(newCats),function(k){var c=newCats[k];return api.set('cats',c.id,{name:c.name,prefix:c.prefix,createdAt:c.createdAt}).then(function(){if(cloud&&!S.cats.some(function(x){return x.id===c.id}))S.cats.push(c)})});
    await pool(Object.keys(newBoxes),function(c){return api.set('boxes',c,{code:c,title:'',loc:'',note:'',createdAt:Date.now()})});
    await pool(items,function(it){var d=Object.assign({},it.data);delete d.id;return api.set('parts',it.id,d)});
    var u=items.filter(function(i){return i.upd}).length;
    toast(items.length-u+' قطعه اضافه و '+u+' قطعه به‌روزرسانی شد.'+(skipped.length?' '+skipped.length+' قطعه‌ی تکراری وارد نشد: '+skipped.slice(0,2).join('، ')+(skipped.length>2?' …':''):''),skipped.length?'bad':'ok');
    S.view='parts';renderAll();
  }catch(e){toast(errMsg(e),'bad')}
}
async function exportFile(name,text){
  if(dl){
    try{await dl.save({filename:name,data:text})}
    catch(e){if(!e||e.code!=='declined')toast('ذخیره‌ی فایل ممکن نشد.','bad')}
    return;
  }
  if(location.protocol==='file:'){
    try{
      var u=URL.createObjectURL(new Blob([text],{type:'text/csv;charset=utf-8'})),a=document.createElement('a');
      a.href=u;a.download=name;document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(u)},4000);toast('فایل ذخیره شد.');return;
    }catch(e){}
  }
  try{await navigator.clipboard.writeText(text);toast('دانلود فایل در این نمایش ممکن نیست. متن CSV کپی شد؛ در اکسل یا یک فایل متنی جایگذاری کن.')}
  catch(e){toast('دانلود فایل در این نمایش ممکن نیست.','bad')}
}
var HEAD=['نام / مقدار','دسته','پکیج','تعداد','وضعیت موجودی','حداقل موجودی','کد باکس','پارت‌نامبر','لینک دیتاشیت','توضیحات'];
function partRow(p){var lv=isLvl(p);return [p.name,catOf(p.cat).n,p.pkg,lv?'':qtyOf(p),lv?LVL[levelOf(p)]:'',lv?'':(p.min||0),p.box,p.mpn,p.link,p.note]}

   ['330Ω ۱/۴W','res','THT',150,50,'R-02','',''],

   ['100nF X7R 50V','cap','0603',600,200,'C-01','',''],['10µF X5R 16V','cap','0805',12,20,'C-01','',''],['22pF NP0','cap','0603',0,50,'C-01','',''],
   ['STM32F103C8T6','ic','LQFP-48',8,3,'U-01','STM32F103C8T6',''],['STM32H743VIT6','ic','LQFP-100',2,1,'U-01','STM32H743VIT6',''],['AMS1117-3.3','ic','SOT-223',25,10,'U-01','AMS1117-3.3',''],

async function clearSample(){
  try{
    await pool(S.parts.filter(function(p){return p.sample}),function(p){return api.del('parts',p.id)});
    await pool(S.boxes.filter(function(b){return b.sample}),function(b){return api.del('boxes',b.id)});
    toast('داده‌های نمونه حذف شد.');
  }catch(e){toast(errMsg(e),'bad')}
}

/* ---------- events ---------- */
function setView(v){S.view=v;S.confirm=null;renderTabs()}
document.addEventListener('click',function(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.dataset.act,id=t.dataset.id,code=t.dataset.code;
  switch(a){
    case 'tab':setView(t.dataset.tab);break;
    case 'go-data':setView('data');break;
    case 'add-part':openPart();break;
    case 'edit-part':openPart(id);break;
    case 'dup-edit':openPart(id);break;
    case 'del-part':S.confirm='p:'+id;renderParts();break;
    case 'del-no':S.confirm=null;renderParts();renderBoxes();break;
    case 'del-yes':S.confirm=null;api.del('parts',id).then(function(){toast('قطعه حذف شد.')}).catch(function(er){toast(errMsg(er),'bad')});renderParts();break;
    case 'inc':case 'dec':{var p=S.parts.find(function(x){return x.id===id});if(p)setQty(id,qtyOf(p)+(a==='inc'?1:-1));break}
    case 'chip':S.cat=t.dataset.cat;renderParts();break;
    case 'low-toggle':S.low=!S.low;renderStats();renderParts();break;
    case 'low-stat':S.low=!S.low;setView('parts');renderStats();renderParts();break;
    case 'reset':S.cat='';S.box='';S.pkg='';S.low=false;S.q='';S.tokens=[];$('q').value='';renderStats();renderParts();break;
    case 'box-open':S.box=code;S.cat='';setView('parts');renderParts();window.scrollTo({top:0,behavior:'smooth'});break;
    case 'dir':S.dir=S.dir==='asc'?'desc':'asc';renderParts();break;
    case 'sortby':{var k=t.dataset.key;if(S.sort===k)S.dir=S.dir==='asc'?'desc':'asc';else{S.sort=k;S.dir='asc'}renderParts();break}
    case 'add-cat':openCat();break;
    case 'del-cat':delCat(id);break;
    case 'add-box':openBox();break;
    case 'edit-box':openBox(code);break;
    case 'del-box':
      if(S.parts.some(function(p){return p.box===code})){toast('در این باکس قطعه هست. اول قطعات را جابه‌جا یا حذف کن.','bad')}
      else{S.confirm='b:'+code;renderBoxes()}
      break;
    case 'boxdel-yes':S.confirm=null;api.del('boxes',code).then(function(){toast('باکس حذف شد.')}).catch(function(er){toast(errMsg(er),'bad')});renderBoxes();break;
    case 'close':closeDrawer();break;
    case 'export-parts':exportFile('partvault-parts.csv',toCSV([HEAD].concat(S.parts.slice().sort(function(a,b){return cmp(a.box||'~',b.box||'~')||cmp(a.name,b.name)}).map(partRow))));break;
    case 'export-boxes':exportFile('partvault-boxes.csv',toCSV([['کد باکس','عنوان','محل نگهداری','توضیحات','تعداد انواع']].concat(S.boxes.slice().sort(function(a,b){return cmp(a.id,b.id)}).map(function(b){return [b.id,b.title,b.loc,b.note,S.parts.filter(function(p){return p.box===b.id}).length]}))));break;
    case 'template':exportFile('partvault-template.csv',toCSV([HEAD,['10kΩ ±1%','مقاومت','0603',200,'',50,'R-01','','','مقاومت عمومی'],['10kΩ ±1%','مقاومت','0805','','فراوان','','R-03','','','شمارش نشده'],['STM32F103C8T6','آی‌سی','LQFP-48',5,'',2,'U-01','STM32F103C8T6','','']]));break;
    case 'sample-load':loadSample();break;
    case 'sample-clear':clearSample();break;
  }
});
document.addEventListener('change',function(e){
  var t=e.target;
  if(t.id==='f-boxfilter'){S.box=t.value;renderParts()}
  else if(t.id==='f-sort'){S.sort=t.value;S.dir='asc';renderParts()}
  else if(t.id==='f-pkgfilter'){S.pkg=t.value;renderParts()}
  else if(t.classList&&t.classList.contains('qn')){setQty(t.dataset.id,toLatin(t.value))}
  else if(t.classList&&t.classList.contains('lvl')){setLevel(t.dataset.id,t.value)}
  else if(t.id==='f-import'){
    var f=t.files&&t.files[0];if(!f)return;
    var r=new FileReader();r.onload=function(){importCSV(String(r.result||''))};r.onerror=function(){toast('خواندن فایل ممکن نشد.','bad')};r.readAsText(f,'utf-8');
    t.value='';
  }
});
$('q').addEventListener('input',function(){
  S.q=this.value;S.tokens=norm(this.value).split(' ').filter(Boolean);
  if(S.view!=='parts')setView('parts');
  renderParts();
});
document.addEventListener('keydown',function(e){
  if(e.key==='Escape'){
    if(!$('dr').hidden){closeDrawer();return}
    if(document.activeElement===$('q')&&$('q').value){$('q').value='';S.q='';S.tokens=[];renderParts()}
  }else if(e.key==='/'&&!/^(INPUT|TEXTAREA|SELECT)$/.test(document.activeElement.tagName)&&$('dr').hidden){e.preventDefault();$('q').focus()}
  else if((e.key==='Enter'||e.key===' ')&&document.activeElement&&document.activeElement.id==='lbl-import'){e.preventDefault();$('f-import').click()}
});

renderAll();
boot();
})();
